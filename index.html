<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatami Maç Ekranı</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
    .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .aka-box { background: #dc2626; padding: 40px; border-radius: 12px; }
    .ao-box { background: #2563eb; padding: 40px; border-radius: 12px; }
    .athlete-name { font-size: 2.5rem; font-weight: bold; }
    .club-name { font-size: 1.2rem; opacity: 0.8; }
    .category-header { background: #1e293b; padding: 15px; border-radius: 8px; font-size: 1.8rem; color: #38bdf8; }
  </style>
</head>
<body>

  <div id="tatamiTitle" style="font-size: 2rem; margin-bottom: 10px;">TATAMİ 1</div>
  <div class="category-header" id="currentCategory">YÜKLENİYOR...</div>

  <div class="scoreboard">
    <div class="aka-box">
      <div style="font-size: 1.2rem;">🔴 AKA</div>
      <div class="athlete-name" id="akaName">-</div>
      <div class="club-name" id="akaClub">-</div>
    </div>

    <div class="ao-box">
      <div style="font-size: 1.2rem;">🔵 AO</div>
      <div class="athlete-name" id="aoName">-</div>
      <div class="club-name" id="aoClub">-</div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // URL'den Tatami Numarasını Al (örn: index.html?tatami=2)
  const urlParams = new URLSearchParams(window.location.search);
  const currentTatami = urlParams.get('tatami') || 1;
  document.getElementById('tatamiTitle').innerText = `TATAMİ ${currentTatami}`;

  // Canlı Maç Verisini Dinle
  db.ref('matches').on('value', snapshot => {
    const matches = snapshot.val();
    if (!matches) return;

    // İlgili Tatamideki ilk 'active' veya 'waiting' maçı getir
    const match = matches.find(m => m.tatami == currentTatami && (m.status === 'active' || m.status === 'waiting'));

    if (match) {
      document.getElementById('currentCategory').innerText = match.category || "Kategori Belirtilmedi";
      document.getElementById('akaName').innerText = match.aka || "—";
      document.getElementById('akaClub').innerText = match.akaClub || "";
      document.getElementById('aoName').innerText = match.ao || "—";
      document.getElementById('aoClub').innerText = match.aoClub || "";
    }
  });
</script>

</body>
</html>
