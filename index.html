<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATAMIX - Canlı Turnuva</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #2ec4b6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; max-width: 1000px; margin: 20px auto; }
    .match-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; position: relative; }
    .match-card.active { border: 2px solid #2ec4b6; background: #162826; }
    .badge { position: absolute; top: 10px; right: 10px; font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; background: #444; }
    .active .badge { background: #e71d36; }
    .aka { color: #ff5252; font-weight: bold; }
    .ao { color: #448aff; font-weight: bold; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h1>🥋 TATAMIX Canlı Maç Akışı</h1>
  <div id="matches" class="grid">Yükleniyor...</div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyCShvh2TAb21zNeGgFLglcl9DbnAXMyaW8",
  authDomain: "tatamix-live.firebaseapp.com",
  databaseURL: "https://tatamix-live-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tatamix-live",
  storageBucket: "tatamix-live.firebasestorage.app",
  messagingSenderId: "23979840281",
  appId: "1:23979840281:web:2bbd869910fa4573326b88"

    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('matches').on('value', (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('matches');
      container.innerHTML = '';
      if (!data) { container.innerHTML = 'Henüz veri yüklenmedi.'; return; }

      data.forEach(match => {
        const card = document.createElement('div');
        const isActive = match.status === 'active';
        card.className = `match-card ${isActive ? 'active' : ''}`;
        card.innerHTML = `
          <div class="badge">${isActive ? '🔴 CANLI' : (match.status === 'completed' ? 'BİTTİ' : 'BEKLİYOR')}</div>
          <small>Tatami ${match.tatami} | ${match.category}</small><br><br>
          <div class="aka">🔴 ${match.aka}</div>
          <div class="ao">🔵 ${match.ao}</div>
        `;
        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
