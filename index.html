<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATAMIX - Canlı Maç Takibi</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #2ec4b6; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; max-width: 1400px; margin: 0 auto; }
    .tatami-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
    .tatami-header { font-size: 1.2rem; font-weight: bold; color: #ff9f1c; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .match-box { background: #2a2a2a; border-radius: 6px; padding: 10px; margin-bottom: 8px; position: relative; border-left: 4px solid #666; }
    .match-box.active { border-left-color: #e71d36; background: #2b1b1d; box-shadow: 0 0 10px rgba(231,29,54,0.3); }
    .match-box.completed { opacity: 0.5; }
    .match-no { font-weight: bold; font-size: 1.1rem; color: #2ec4b6; }
    .badge { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; font-weight: bold; padding: 3px 6px; border-radius: 3px; background: #444; }
    .active .badge { background: #e71d36; }
    .category { font-size: 0.8rem; color: #aaa; margin: 4px 0 8px 0; }
    .aka { color: #ff5252; font-weight: bold; }
    .ao { color: #448aff; font-weight: bold; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h1>🥋 TATAMIX Canlı Maç Akışı</h1>
  <div id="tatamiGrid" class="grid">Yükleniyor...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCShvh2TAb21zNeGgFLglcl9DbnAXMyaW8",
      authDomain: "tatamix-live.firebaseapp.com",
      databaseURL: "https://tatamix-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tatamix-live",
      storageBucket: "tatamix-live.firebasestorage.app",
      messagingSenderId: "23979840281",
      appId: "1:23979840281:web:2bbd869910fa4573326b88"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('matches').on('value', (snapshot) => {
      const data = snapshot.val() || [];
      const grid = document.getElementById('tatamiGrid');
      grid.innerHTML = '';

      // Maçları Tatami bazında grupla
      for (let t = 1; t <= 9; t++) {
        const tatamiMatches = data.filter(m => parseInt(m.tatami) === t);
        if (tatamiMatches.length === 0) continue;

        const col = document.createElement('div');
        col.className = 'tatami-card';
        
        let html = `<div class="tatami-header"><span>Tatami ${t}</span></div>`;

        tatamiMatches.forEach((match, index) => {
          const matchCode = `${t}${(index + 1).toString().padStart(2, '0')}`;
          const isActive = match.status === 'active';
          
          html += `
            <div class="match-box ${match.status}">
              <div class="badge">${isActive ? '🔴 CANLI' : (match.status === 'completed' ? 'BİTTİ' : 'BEKLİYOR')}</div>
              <div class="match-no">MAÇ NO: ${matchCode}</div>
              <div class="category">${match.category}</div>
              <div class="aka">🔴 ${match.aka} <small>(${match.akaClub || ''})</small></div>
              <div class="ao">🔵 ${match.ao} <small>(${match.aoClub || ''})</small></div>
            </div>
          `;
        });

        col.innerHTML = html;
        grid.appendChild(col);
      }
    });
  </script>
</body>
</html>
