<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATAMIX - Tatami Şefi Kontrol Paneli</title>
  <style>
    :root {
      --bg-dark: #0f172a; --card-bg: #1e293b; --accent: #38bdf8;
      --text: #f8fafc; --border: #334155; --aka: #ef4444; --ao: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text); padding: 15px; }

    /* ORTAK NAVBAR */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 12px 20px; border-radius: 10px;
      margin-bottom: 20px; border: 1px solid var(--border);
    }
    .nav-logo { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
    .nav-links { display: flex; gap: 10px; }
    .nav-btn {
      background: #334155; color: #fff; border: 1px solid #475569;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none;
    }

    .chef-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .current-match-card { background: var(--card-bg); border: 2px solid var(--accent); border-radius: 12px; padding: 20px; }
    .fighters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
    .fighter-box { padding: 15px; border-radius: 8px; font-weight: bold; }
    .fighter-box.aka { background: rgba(239, 68, 68, 0.15); border-left: 5px solid var(--aka); }
    .fighter-box.ao { background: rgba(59, 130, 246, 0.15); border-left: 5px solid var(--ao); }
    .action-btn { width: 100%; background: #22c55e; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- OTURUM KONTROLÜ -->
  <script>
    const activeSession = sessionStorage.getItem('chef_session');
    if (!activeSession) {
      alert('Tatami Şefi girişi yapmalısınız!');
      window.location.href = 'index.html';
    }
    const chefData = JSON.parse(activeSession);
  </script>

  <nav class="navbar">
    <div class="nav-logo" id="tatamiTitle">📍 TATAMİ KONTROL PANELİ</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">📺 Canlı İzleyici Ekranı</a>
      <a href="admin.html" class="nav-btn">⚙️ Admin Paneli</a>
      <button class="nav-btn" style="background:#dc2626;" onclick="logoutChef()">🚪 Oturumu Kapat</button>
    </div>
  </nav>

  <div class="chef-container">
    <div class="current-match-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="background:var(--aka); color:#fff; padding:4px 8px; border-radius:4px; font-weight:bold;">🔴 CANLI MAÇ</span>
        <span style="font-size:1.2rem; font-weight:bold; color:var(--accent);">MAÇ NO: #101</span>
      </div>
      <div class="fighters-grid">
        <div class="fighter-box aka">🔴 AKA: YAHYA ALTINTAŞ <br><small style="color:#94a3b8">İzmit SK</small></div>
        <div class="fighter-box ao">🔵 AO: DOĞUKAN DEMİREL <br><small style="color:#94a3b8">Ay Yıldız SK</small></div>
      </div>
      <button class="action-btn" onclick="alert('Maç tamamlandı, bir sonraki maça geçiliyor.')">✅ Maçı Bitir & Sıradakine Geç</button>
    </div>
  </div>

  <script>
    document.getElementById('tatamiTitle').innerText = `📍 TATAMİ ${chefData.tatami} KONTROL PANELİ (${chefData.user})`;

    function logoutChef() {
      sessionStorage.removeItem('chef_session');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
