<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATAMIX - Admin Paneli</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a; --card-bg: #1e293b; --accent: #38bdf8;
      --text-main: #f8fafc; --border-color: #334155; --danger: #dc2626; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ORTAK NAVBAR */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 12px 20px; border-bottom: 1px solid var(--border-color);
    }
    .nav-logo { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
    .nav-links { display: flex; gap: 10px; }
    .nav-btn {
      background: #334155; color: #fff; border: 1px solid #475569;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none;
    }

    .admin-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 240px; background: var(--card-bg); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .menu-btn { background: transparent; color: var(--text-main); border: 1px solid transparent; padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
    .menu-btn.active { background: var(--accent); color: #000; font-weight: bold; }

    .main-content { flex: 1; padding: 25px; overflow-y: auto; }
    .tatami-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
    .tatami-column { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; min-height: 400px; }

    .category-list { display: flex; flex-direction: column; gap: 10px; min-height: 300px; padding: 5px; background: rgba(0,0,0,0.15); border-radius: 8px; }
    .category-card { background: #334155; border: 1px solid #475569; border-radius: 8px; padding: 12px; cursor: grab; }
    .cat-title { font-weight: bold; display: flex; justify-content: space-between; }

    .btn-action { background: var(--success); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- OTURUM KONTROLÜ -->
  <script>
    if (sessionStorage.getItem('admin_logged') !== 'true') {
      alert('Bu sayfaya erişim yetkiniz yok! Lütfen Giriş Yapın.');
      window.location.href = 'index.html';
    }
  </script>

  <nav class="navbar">
    <div class="nav-logo">⚙️ ADMIN PANELI</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">📺 Canlı İzleyici Ekranı</a>
      <a href="chef.html" class="nav-btn">🥋 Şef Paneli</a>
      <button class="nav-btn" style="background:var(--danger);" onclick="logoutAdmin()">🚪 Çıkış Yap</button>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="sidebar">
      <button class="menu-btn active">📥 PDF Kura & Sıralama</button>
    </aside>

    <main class="main-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>2. Gün PDF Kuraları ve Maç Sıralama Tahtası</h2>
        <button class="btn-action" onclick="recalculateMatchNumbers()">🔢 Maç Numaralarını Yeniden Hesapla</button>
      </div>

      <div class="tatami-columns">
        <div class="tatami-column">
          <h3>TATAMİ 1</h3>
          <div class="category-list" id="tatami-1-list" ondragover="allowDrop(event)" ondrop="drop(event)">
            <div class="category-card" draggable="true" id="cat_101" ondragstart="drag(event)">
              <div class="cat-title"><span>10. Sınıf Erkek Kumite</span></div>
              <div style="font-size:0.8rem; color:#94a3b8;">Başlangıç No: <strong class="start-match-no">#101</strong></div>
            </div>
          </div>
        </div>

        <div class="tatami-column">
          <h3>TATAMİ 2</h3>
          <div class="category-list" id="tatami-2-list" ondragover="allowDrop(event)" ondrop="drop(event)">
            <div class="category-card" draggable="true" id="cat_201" ondragstart="drag(event)">
              <div class="cat-title"><span>Genç Erkek Kata</span></div>
              <div style="font-size:0.8rem; color:#94a3b8;">Başlangıç No: <strong class="start-match-no">#201</strong></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    function drop(ev) {
      ev.preventDefault();
      const data = ev.dataTransfer.getData("text");
      let dropTarget = ev.target;
      while (dropTarget && !dropTarget.classList.contains('category-list')) {
        dropTarget = dropTarget.parentElement;
      }
      if (dropTarget) {
        dropTarget.appendChild(document.getElementById(data));
        recalculateMatchNumbers();
      }
    }

    function recalculateMatchNumbers() {
      [1, 2].forEach(tatamiNum => {
        const listEl = document.getElementById(`tatami-${tatamiNum}-list`);
        if(!listEl) return;
        const cards = listEl.querySelectorAll('.category-card');
        let counter = 101 + ((tatamiNum - 1) * 100);
        cards.forEach(card => {
          card.querySelector('.start-match-no').innerText = `#${counter}`;
          counter += 2; // Örnek artış
        });
      });
    }

    function logoutAdmin() {
      sessionStorage.removeItem('admin_logged');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
