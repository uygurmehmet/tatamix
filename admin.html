<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATAMIX - Yönetim Paneli</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    h2 { margin-top: 0; color: #1a1a1a; }
    .card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .tatami-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
    .tab-btn { background: #e4e6eb; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #007bff; color: white; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; background: #e9ecef; padding: 12px; border-radius: 6px; align-items: center; }
    .btn { padding: 8px 14px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .btn-next { background: #28a745; color: white; font-size: 1rem; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .match-list { display: flex; flex-direction: column; gap: 8px; }
    .match-item { background: #fff; border: 1px solid #ddd; border-left: 6px solid #6c757d; border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .match-item.status-active { border-left-color: #28a745; background: #e8f5e9; }
    .match-item.status-completed { border-left-color: #dc3545; opacity: 0.6; }
    .match-item.status-waiting { border-left-color: #ffc107; }
    .badge { font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 0.85rem; }
    .badge-code { background: #343a40; color: #fff; }
    .badge-status { text-transform: uppercase; font-size: 0.75rem; margin-left: 5px; }
    .status-active .badge-status { background: #28a745; color: #fff; }
    .status-completed .badge-status { background: #dc3545; color: #fff; }
    .status-waiting .badge-status { background: #ffc107; color: #000; }
    .order-btns button { border: 1px solid #ccc; background: #fff; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <h2>🥋 TATAMIX Yönetim Paneli</h2>

  <div class="card">
    <h3>📄 Kura PDF Yükle</h3>
    <input type="file" id="pdfInput" accept="application/pdf">
    <button class="btn btn-secondary" onclick="loadSampleData()">Örnek Eleme Kurası Yükle</button>
  </div>

  <div class="card">
    <div class="tatami-tabs" id="tatamiTabs"></div>
    <div class="controls">
      <button class="btn btn-next" onclick="nextMatch()">▶️ Sıradaki Maça Geç</button>
      <button class="btn btn-danger" onclick="finishCurrentMatch()">⏹️ Canlı Maçı Bitir</button>
      <span id="currentStatusText" style="margin-left:auto; font-weight:bold;"></span>
    </div>
    <div id="matchList" class="match-list">Yükleniyor...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCShvh2TAb21zNeGgFLglcl9DbnAXMyaW8",
      authDomain: "tatamix-live.firebaseapp.com",
      databaseURL: "https://tatamix-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tatamix-live",
      storageBucket: "tatamix-live.firebasestorage.app",
      messagingSenderId: "23979840281",
      appId: "1:23979840281:web:2bbd869910fa4573326b88"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allMatches = [];
    let selectedTatami = 1;

    // Tatami Sekmelerini Oluştur (1..9)
    function renderTabs() {
      const tabs = document.getElementById('tatamiTabs');
      tabs.innerHTML = '';
      for (let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${selectedTatami === i ? 'active' : ''}`;
        btn.innerText = `Tatami ${i}`;
        btn.onclick = () => { selectedTatami = i; renderTabs(); renderMatchList(); };
        tabs.appendChild(btn);
      }
    }

    // Veritabanı Dinleyici
    db.ref('matches').on('value', (snapshot) => {
      allMatches = snapshot.val() || [];
      renderMatchList();
    });

    // Filtrelenmiş Liste Render
    function renderMatchList() {
      const listContainer = document.getElementById('matchList');
      listContainer.innerHTML = '';

      const filtered = allMatches.filter(m => parseInt(m.tatami) === selectedTatami);

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p>Tatami ${selectedTatami} için kayıtlı maç bulunamadı.</p>`;
        return;
      }

      let activeCount = 0;
      filtered.forEach((match, index) => {
        const globalIndex = allMatches.indexOf(match);
        const matchCode = `${selectedTatami}${(index + 1).toString().padStart(2, '0')}`;
        
        if (match.status === 'active') activeCount++;

        const div = document.createElement('div');
        div.className = `match-item status-${match.status}`;
        div.innerHTML = `
          <div>
            <span class="badge badge-code">MAÇ NO: ${matchCode}</span>
            <span class="badge badge-status">${match.status === 'active' ? 'CANLI' : (match.status === 'completed' ? 'BİTTİ' : 'BEKLİYOR')}</span>
            <small>(${match.category})</small><br>
            <span style="color:#d9534f; font-weight:bold;">🔴 ${match.aka}</span> (${match.akaClub || ''}) 
            vs 
            <span style="color:#0275d8; font-weight:bold;">🔵 ${match.ao}</span> (${match.aoClub || ''})
          </div>
          <div>
            <div class="order-btns" style="display:inline-block; margin-right:10px;">
              <button onclick="moveMatch(${globalIndex}, -1)">▲</button>
              <button onclick="moveMatch(${globalIndex}, 1)">▼</button>
            </div>
            <button class="btn btn-secondary" onclick="setIndividualStatus(${globalIndex}, 'active')">Canlı Yap</button>
            <button class="btn btn-danger" onclick="setIndividualStatus(${globalIndex}, 'completed')">Bitir</button>
          </div>
        `;
        listContainer.appendChild(div);
      });

      document.getElementById('currentStatusText').innerText = 
        `Tatami ${selectedTatami} Durumu: ${activeCount > 0 ? '🔴 CANLI MAÇ VAR' : '⚪ BEKLEMEDE'}`;
    }

    // Sıradaki Maça Geç (Mevcut Canlıyı Bitir, Bir Sonraki Bekleyeni Canlı Yap)
    function nextMatch() {
      const tatamiMatches = allMatches.filter(m => parseInt(m.tatami) === selectedTatami);
      const activeMatch = tatamiMatches.find(m => m.status === 'active');
      const nextWaitingMatch = tatamiMatches.find(m => m.status === 'waiting');

      if (activeMatch) {
        activeMatch.status = 'completed';
      }

      if (nextWaitingMatch) {
        nextWaitingMatch.status = 'active';
      } else {
        alert(`Tatami ${selectedTatami} üzerinde bekleyen maç kalmadı!`);
      }

      db.ref('matches').set(allMatches);
    }

    function finishCurrentMatch() {
      const tatamiMatches = allMatches.filter(m => parseInt(m.tatami) === selectedTatami);
      const activeMatch = tatamiMatches.find(m => m.status === 'active');
      if (activeMatch) {
        activeMatch.status = 'completed';
        db.ref('matches').set(allMatches);
      }
    }

    function setIndividualStatus(index, status) {
      if (status === 'active') {
        // Bir tatamide aynı anda yalnızca 1 maç canlı olabilir
        const targetTatami = parseInt(allMatches[index].tatami);
        allMatches.forEach(m => {
          if (parseInt(m.tatami) === targetTatami && m.status === 'active') {
            m.status = 'completed';
          }
        });
      }
      allMatches[index].status = status;
      db.ref('matches').set(allMatches);
    }

    // Sıralamayı Değiştirme (Yukarı / Aşağı)
    function moveMatch(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= allMatches.length) return;
      if (allMatches[index].tatami !== allMatches[targetIndex].tatami) return;

      const temp = allMatches[index];
      allMatches[index] = allMatches[targetIndex];
      allMatches[targetIndex] = temp;

      db.ref('matches').set(allMatches);
    }

    function loadSampleData() {
      const samples = [
        {tatami: 1, category: "60 KG ERKEK ELEME", aka: "ALTINTAŞ YAHYA", akaClub: "SAMSUN", ao: "DEMİREL DOĞUKAN", aoClub: "AY YILDIZ", status: "active"},
        {tatami: 1, category: "60 KG ERKEK ELEME", aka: "UYSAL ALP EMİR", akaClub: "KATANA", ao: "ALTINTAŞ MEHMET", aoClub: "NAZİLLİ", status: "waiting"},
        {tatami: 1, category: "60 KG ERKEK ÇEYREK FİNAL", aka: "KAZANAN MAÇ 101", akaClub: "", ao: "KAZANAN MAÇ 102", aoClub: "", status: "waiting"},
        {tatami: 2, category: "67 KG ERKEK ELEME", aka: "ZALAT USAME", akaClub: "İSTANBUL", ao: "KARATÖZ RAMAZAN", aoClub: "ANTAKYA", status: "active"},
        {tatami: 2, category: "67 KG ERKEK ELEME", aka: "ÇİLLO NİZAR", akaClub: "ARAS", ao: "ÇOBAN OGÜN", aoClub: "UŞAK", status: "waiting"}
      ];
      db.ref('matches').set(samples);
    }

    renderTabs();
  </script>
</body>
</html>
