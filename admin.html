<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karate Turnuva Yönetim Paneli</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 10px; padding: 20px; border: 1px solid #334155; }
    .card h3 { margin-top: 0; color: #f43f5e; display: flex; align-items: center; gap: 8px; }
    label { display: block; margin-top: 10px; font-weight: 600; color: #94a3b8; }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff;
    }
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 20px; margin-top: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .tatami-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .tatami-btn { background: #334155; border: none; padding: 8px 16px; color: #fff; border-radius: 6px; cursor: pointer; }
    .tatami-btn.active { background: #0284c7; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>🥋 Karate Turnuvası - Yönetim Paneli</h1>

  <div class="grid">
    <!-- KURA YÜKLEME KARTI -->
    <div class="card">
      <h3>📥 Kura Yükle (JSON / JS)</h3>
      <p style="font-size:0.85rem; color:#94a3b8;">Önceden hazırladığınız veya PDF'ten dönüştürdüğünüz <code>.json</code> veya <code>.js</code> kura dosyasını seçin.</p>
      
      <label>Kura Dosyası Seç (.json / .js):</label>
      <input type="file" id="jsonInput" accept=".json,.js">
      
      <button class="btn" onclick="loadMatchJson()">Sisteme Aktar ve Maçları Başlat</button>
    </div>

    <!-- SİSTEM VE TATAMİ AYARLARI -->
    <div class="card">
      <h3>⚙️ Tatami ve Şifre Ayarları</h3>
      <label>Aktif Tatami Sayısı:</label>
      <input type="number" id="tatamiCountInput" min="1" max="10" value="4">

      <label>Süper Admin Şifresi:</label>
      <input type="text" id="adminPassInput" value="12345">

      <button class="btn" onclick="saveSettings()">Ayarları Güncelle</button>
    </div>
  </div>

  <!-- TATAMİ DURUMLARI VE MAÇ LİSTESİ -->
  <div class="card" style="margin-top:20px;">
    <h3>📊 Aktif Tatami Maçları</h3>
    <div class="tatami-tabs" id="tatamiTabs"></div>
    <div id="matchList" style="margin-top:15px;"></div>
  </div>
</div>

<script>
  // FIREBASE CONFIGURATION (Kendi bilgilerinizi yapıştırın)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 1. JSON / JS DOSYASI YÜKLEME
  function loadMatchJson() {
    const fileInput = document.getElementById('jsonInput');
    if (!fileInput.files.length) {
      alert("Lütfen geçerli bir JSON/JS dosyası seçin!");
      return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      try {
        let content = e.target.result;

        // JS Dosyası olarak verildiyse (örn: const matches = [...];) saf JSON formatına çek
        if (content.includes('=')) {
          content = content.substring(content.indexOf('['), content.lastIndexOf(']') + 1);
        }

        const matches = JSON.parse(content);

        if (Array.isArray(matches) && matches.length > 0) {
          // Firebase üzerindeki maçlar düğümünü sıfırla ve yenisini yükle
          db.ref('matches').set(matches).then(() => {
            alert(`✅ Kura başarıyla yüklendi! Toplam ${matches.length} maç aktarıldı.`);
            renderMatches(matches);
          });
        } else {
          alert("Dosya boş veya uygun formatta değil!");
        }
      } catch (err) {
        alert("JSON Okuma Hatası! Dosya formatını kontrol edin.\nHata: " + err.message);
      }
    };

    reader.readAsText(file);
  }

  // 2. TATAMİ SAYISI VE ŞİFRE GÜNCELLEME
  function saveSettings() {
    const count = parseInt(document.getElementById('tatamiCountInput').value) || 4;
    const adminPass = document.getElementById('adminPassInput').value;

    db.ref('settings').set({
      tatamiCount: count,
      adminPass: adminPass
    }).then(() => {
      alert("Ayarlar kaydedildi!");
      setupTabs(count);
    });
  }

  function setupTabs(count) {
    const container = document.getElementById('tatamiTabs');
    container.innerHTML = '';
    for(let i=1; i<=count; i++) {
      container.innerHTML += `<button class="tatami-btn ${i===1?'active':''}" onclick="filterTatami(${i})">Tatami ${i}</button>`;
    }
  }

  setupTabs(4); // Varsayılan başlatma
</script>

</body>
</html>
