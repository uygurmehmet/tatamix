<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>TATAMIX - Yönetim Paneli</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
    .match-item { background: #fff; padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ccc; }
    .match-item.active { border-left-color: #2ec4b6; background: #e8f8f5; }
    button { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; margin-left: 5px; }
    .btn-active { background: #2ec4b6; color: white; }
    .btn-complete { background: #e71d36; color: white; }
    .btn-init { background: #007bff; color: white; padding: 10px 20px; font-weight: bold; margin-bottom: 15px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h2>Yönetim Paneli</h2>
  <button class="btn-init" onclick="uploadData()">1. Kuraları Yükle / Sıfırla</button>
  <div id="admin-list"></div>

  <script>
   const firebaseConfig = {
  apiKey: "AIzaSyCShvh2TAb21zNeGgFLglcl9DbnAXMyaW8",
  authDomain: "tatamix-live.firebaseapp.com",
  databaseURL: "https://tatamix-live-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tatamix-live",
  storageBucket: "tatamix-live.firebasestorage.app",
  messagingSenderId: "23979840281",
  appId: "1:23979840281:web:2bbd869910fa4573326b88"

    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const initialKuraData = [
      {"id":101,"tatami":1,"category":"60 KG ERKEK U21","aka":"ALINTAS YAHYA CAN","akaClub":"SAMSUN KUTLU SPOR KULUBU","ao":"DEMIREL DOGUKAN","aoClub":"AY YILDIZ KARATE DO SPOR KULÜBÜ","status":"active"},
      {"id":102,"tatami":1,"category":"60 KG ERKEK U21","aka":"UYSAL ALP EMIR","akaClub":"KATANA SPOR KULÜBÜ","ao":"ALTINTAS MEHMET","aoClub":"NAZILLI CELEBI SPOR KULUBU","status":"waiting"},
      {"id":201,"tatami":2,"category":"60 KG ERKEK U21","aka":"ZALAT USAME","akaClub":"ISTANBUL SANAT SPOR KULUBU","ao":"KARATOZ RAMAZAN EGE","aoClub":"ANTAKYA BELEDIYESI SPOR KULUBU","status":"active"},
      {"id":301,"tatami":3,"category":"67 KG ERKEK U21","aka":"CHILLO NIZAR","akaClub":"ARAS KARATE SPOR KULUBU","ao":"COBAN OGUNC BERK","aoClub":"USAK KARATE OZLEM SPOR KULUBU","status":"active"},
      {"id":401,"tatami":4,"category":"+84 KG ERKEK U21","aka":"CYAGLI KEREM TUGRA","akaClub":"CORUM BELEDIYESI SPOR KULUBU","ao":"PERSINGER SERDAR DANIEL","aoClub":"KUŞADASI İRFAN YİĞİT SPOR KULÜBÜ","status":"active"}
    ];

    function uploadData() {
      if(confirm("Kuralar yüklenecek onaylıyor musunuz?")) {
        db.ref('matches').set(initialKuraData);
      }
    }

    function setStatus(index, status) {
      db.ref(`matches/${index}/status`).set(status);
    }

    db.ref('matches').on('value', (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('admin-list');
      container.innerHTML = '';
      if (!data) return;

      data.forEach((match, index) => {
        const div = document.createElement('div');
        div.className = `match-item ${match.status}`;
        div.innerHTML = `
          <div><b>[Tatami ${match.tatami}]</b> ${match.aka} vs ${match.ao}</div>
          <div>
            <button class="btn-active" onclick="setStatus(${index}, 'active')">Canlıya Al</button>
            <button class="btn-complete" onclick="setStatus(${index}, 'completed')">Bitir</button>
          </div>
        `;
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
