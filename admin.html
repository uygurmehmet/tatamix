<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATAMIX - Tatami Şefleri Yetkilendirme</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: 250px; background: var(--card-bg); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar h2 { color: var(--accent); margin-bottom: 20px; font-size: 1.5rem; }
    .menu-btn { background: transparent; color: var(--text-main); border: 1px solid transparent; padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .menu-btn:hover { background: #334155; }
    .menu-btn.active { background: var(--accent); color: #000; font-weight: bold; }

    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
    
    .auth-list { display: flex; flex-direction: column; gap: 15px; max-width: 600px; }
    .auth-row { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; }
    .tatami-label { font-weight: bold; color: var(--accent); width: 100px; }
    
    .input-group { display: flex; flex-direction: column; flex: 1; }
    .input-group label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .input-group input { background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
    .input-group input:focus { border-color: var(--accent); }

    .btn-save { background: #22c55e; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; max-width: 600px; font-size: 1.1rem; }
    .btn-save:hover { background: #16a34a; }

    .preview-panel { width: 350px; background: #000; border-left: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; text-align: center; }
    .preview-box { border: 2px dashed #334155; padding: 40px 20px; border-radius: 12px; width: 100%; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h2>🥋 TATAMIX</h2>
    <button class="menu-btn active">🔑 Tatami Şefleri</button>
    <button class="menu-btn">🥋 Tatami Yönetimi</button>
    <button class="menu-btn">📥 Kura / Maç Yükle</button>
    <button class="menu-btn" style="margin-top: auto; border: 1px solid #dc2626; color: #dc2626;">🚪 Oturumu Kapat</button>
  </aside>

  <main class="main-content">
    <div class="header-area">
      <h1>Tatami Şefleri Yetkilendirme</h1>
      <span style="color: #94a3b8;">Sistemdeki Aktif Tatami: <strong id="activeTatamiCount">4</strong></span>
    </div>

    <p style="margin-bottom: 20px; color: #94a3b8;">Her bir tatami ekranını yönetecek hakemler/şefler için oturum açma bilgilerini belirleyin. Şifreler anında aktif olur.</p>

    <div class="auth-list" id="authListContainer"></div>

    <button class="btn-save" onclick="saveCredentials()">💾 Şifreleri Kaydet ve Güncelle</button>
  </main>

  <aside class="preview-panel">
    <div class="preview-box">
      <h3>📺 İzleyici Ekranı</h3>
      <p style="margin-top: 10px; font-size: 0.9rem;">Bu alanda seçilen tataminin canlı skorboard önizlemesi yer alacaktır.</p>
    </div>
  </aside>

  <script>
    const TOTAL_TATAMIS = 4; 

    const currentAuthData = {
      1: { user: "tatami1", pass: "t1pass" },
      2: { user: "tatami2", pass: "t2pass" },
      3: { user: "tatami3", pass: "12345" },
      4: { user: "tatami4", pass: "12345" }
    };

    function renderAuthRows() {
      const container = document.getElementById('authListContainer');
      document.getElementById('activeTatamiCount').innerText = TOTAL_TATAMIS;
      container.innerHTML = '';

      for (let i = 1; i <= TOTAL_TATAMIS; i++) {
        const data = currentAuthData[i] || { user: `tatami${i}`, pass: `12345` };
        
        container.innerHTML += `
          <div class="auth-row">
            <div class="tatami-label">📍 TATAMİ ${i}</div>
            <div class="input-group">
              <label>Kullanıcı Adı</label>
              <input type="text" id="user_t${i}" value="${data.user}">
            </div>
            <div class="input-group">
              <label>Giriş Şifresi</label>
              <input type="text" id="pass_t${i}" value="${data.pass}">
            </div>
          </div>
        `;
      }
    }

    function saveCredentials() {
      const updatedAuth = {};
      for (let i = 1; i <= TOTAL_TATAMIS; i++) {
        const username = document.getElementById(`user_t${i}`).value.trim();
        const password = document.getElementById(`pass_t${i}`).value.trim();
        
        if (!username || !password) {
          alert(`Hata: Tatami ${i} için kullanıcı adı ve şifre boş bırakılamaz!`);
          return;
        }
        updatedAuth[i] = { user: username, pass: password };
      }
      alert("✅ Şifreler başarıyla güncellendi! Tatami şefleri yeni bilgileriyle anında giriş yapabilirler.");
    }

    window.onload = renderAuthRows;
  </script>

</body>
</html>
